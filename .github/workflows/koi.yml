# Copy into your profile repository as .github/workflows/koi.yml, then embed
# <img src="koi/koi.gif" width="256" alt="My koi"> in its README.md.
name: Koi

on:
  schedule:
    # Just after midnight UTC, so the koi shows the day that just ended.
    - cron: "20 0 * * *"
  workflow_dispatch:
  push:
    paths: [.github/workflows/koi.yml]

permissions:
  contents: write

concurrency: koi

jobs:
  koi:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      # Built from the adiprathapa/git-koi fork, which adds the blue body.
      - name: Install git-koi
        run: |
          cargo install --git https://github.com/adiprathapa/git-koi --locked
          cargo install --git https://github.com/adiprathapa/git-koi --locked \
            --features narrow --root "$RUNNER_TEMP/narrow"
      - name: Draw the koi
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          git-koi collect "$GITHUB_REPOSITORY_OWNER" --output "$RUNNER_TEMP/koi-snapshot.json"
          git-koi render "$RUNNER_TEMP/koi-snapshot.json" --output-dir koi --body blue
      # Phones get the narrow koi, so the fish keeps its size on a small screen, at half
      # size and every other frame so it stays light enough for a phone to decode.
      - name: Make the mobile koi
        run: |
          "$RUNNER_TEMP/narrow/bin/git-koi" render "$RUNNER_TEMP/koi-snapshot.json" \
            --output-dir "$RUNNER_TEMP/koi-narrow" --body blue
          sudo apt-get install -y -qq gifsicle > /dev/null
          narrow_gif="$RUNNER_TEMP/koi-narrow/koi.gif"
          frame_count=$(gifsicle --info "$narrow_gif" | head -1 | awk '{print $3}')
          gifsicle --resize-method sample --scale 0.5 --delay 13 --loopcount=forever -O2 \
            "$narrow_gif" $(seq -f "#%g" 0 2 $((frame_count - 1))) -o koi/koi-mobile.gif
      - name: Commit the koi if it changed
        shell: bash
        run: |
          git add koi/koi.gif koi/koi-mobile.gif
          if git diff --cached --quiet; then
            echo "The koi is unchanged; nothing to commit."
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git commit --quiet --message "koi: draw the day's koi"
          git push --quiet
